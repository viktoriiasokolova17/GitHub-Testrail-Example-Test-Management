<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Test Runner</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --success: #3fb950;
            --warning: #d29922;
            --danger: #f85149;
            --purple: #a371f7;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo svg {
            width: 32px;
            height: 32px;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn:hover {
            background: var(--border);
        }

        .btn-primary {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .btn-primary:hover {
            background: #2ea043;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-card.total .stat-value { color: var(--accent); }
        .stat-card.passed .stat-value { color: var(--success); }
        .stat-card.failed .stat-value { color: var(--danger); }
        .stat-card.blocked .stat-value { color: var(--warning); }
        .stat-card.untested .stat-value { color: var(--text-secondary); }

        .progress-bar {
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .progress-fill {
            height: 100%;
            display: flex;
        }

        .progress-segment {
            height: 100%;
            transition: width 0.3s;
        }

        .progress-segment.passed { background: var(--success); }
        .progress-segment.failed { background: var(--danger); }
        .progress-segment.blocked { background: var(--warning); }

        .filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .filter-btn {
            padding: 0.375rem 0.75rem;
            font-size: 0.8125rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .test-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .test-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.15s;
        }

        .test-item:hover {
            border-color: var(--text-secondary);
        }

        .test-item.expanded {
            flex-direction: column;
            align-items: stretch;
        }

        .test-item.expanded .test-main {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .test-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--purple);
            background: rgba(163, 113, 247, 0.1);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            white-space: nowrap;
        }

        .test-title {
            flex: 1;
            font-weight: 500;
        }

        .test-priority {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .priority-critical { background: rgba(248, 81, 73, 0.2); color: var(--danger); }
        .priority-high { background: rgba(210, 153, 34, 0.2); color: var(--warning); }
        .priority-medium { background: rgba(88, 166, 255, 0.2); color: var(--accent); }

        .status-buttons {
            display: flex;
            gap: 0.375rem;
        }

        .status-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-btn.pass { background: rgba(63, 185, 80, 0.2); }
        .status-btn.pass:hover, .status-btn.pass.active { background: var(--success); border-color: var(--success); }
        .status-btn.fail { background: rgba(248, 81, 73, 0.2); }
        .status-btn.fail:hover, .status-btn.fail.active { background: var(--danger); border-color: var(--danger); }
        .status-btn.blocked { background: rgba(210, 153, 34, 0.2); }
        .status-btn.blocked:hover, .status-btn.blocked.active { background: var(--warning); border-color: var(--warning); }
        .status-btn.skip { background: rgba(139, 148, 158, 0.2); }
        .status-btn.skip:hover, .status-btn.skip.active { background: var(--text-secondary); }

        .test-details {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .test-steps {
            background: var(--bg-tertiary);
            border-radius: 6px;
            padding: 1rem;
            font-size: 0.875rem;
        }

        .test-steps h4 {
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .test-steps ol {
            margin-left: 1.25rem;
        }

        .test-steps li {
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .notes-input {
            margin-top: 1rem;
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.875rem;
            resize: vertical;
        }

        .notes-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow: auto;
        }

        .modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.625rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.875rem;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .export-preview {
            background: var(--bg-tertiary);
            border-radius: 6px;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            max-height: 300px;
            overflow: auto;
            white-space: pre-wrap;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--success);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .suite-header {
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border-radius: 6px;
            margin-bottom: 0.5rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .suite-stats {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Sample test data - in real implementation, this would come from GitHub API
        const initialTests = [
            { id: 'TC-TODO-001', title: 'Add a new task with valid text', suite: 'Add Tasks', priority: 'critical', status: 'untested', steps: ['Open the Todo app', 'Click input field', 'Type "Buy groceries"', 'Click Add Task', 'Verify task appears'], notes: '' },
            { id: 'TC-TODO-002', title: 'Add a new task using Enter key', suite: 'Add Tasks', priority: 'high', status: 'untested', steps: ['Click input field', 'Type "Call mom"', 'Press Enter', 'Verify task added'], notes: '' },
            { id: 'TC-TODO-003', title: 'Cannot add empty task', suite: 'Add Tasks', priority: 'high', status: 'untested', steps: ['Leave input empty', 'Click Add Task', 'Verify no task added'], notes: '' },
            { id: 'TC-TODO-010', title: 'Mark task as completed', suite: 'Complete Tasks', priority: 'critical', status: 'untested', steps: ['Add a task', 'Click checkbox', 'Verify strikethrough', 'Verify stats update'], notes: '' },
            { id: 'TC-TODO-011', title: 'Unmark completed task', suite: 'Complete Tasks', priority: 'high', status: 'untested', steps: ['Complete a task', 'Click checkbox again', 'Verify task active'], notes: '' },
            { id: 'TC-TODO-020', title: 'Delete a task', suite: 'Delete Tasks', priority: 'critical', status: 'untested', steps: ['Add a task', 'Hover over task', 'Click delete button', 'Verify removal'], notes: '' },
            { id: 'TC-TODO-021', title: 'Clear all completed tasks', suite: 'Delete Tasks', priority: 'high', status: 'untested', steps: ['Add multiple tasks', 'Complete some', 'Click Clear completed', 'Verify only active remain'], notes: '' },
            { id: 'TC-TODO-030', title: 'Filter - Show all tasks', suite: 'Filters', priority: 'high', status: 'untested', steps: ['Add mix of tasks', 'Click All filter', 'Verify all visible'], notes: '' },
            { id: 'TC-TODO-031', title: 'Filter - Show only active', suite: 'Filters', priority: 'high', status: 'untested', steps: ['Add mix of tasks', 'Click Active filter', 'Verify only active shown'], notes: '' },
            { id: 'TC-TODO-032', title: 'Filter - Show only completed', suite: 'Filters', priority: 'high', status: 'untested', steps: ['Add mix of tasks', 'Click Completed filter', 'Verify only completed shown'], notes: '' },
        ];

        function App() {
            const [tests, setTests] = useState(() => {
                const saved = localStorage.getItem('testRunData');
                return saved ? JSON.parse(saved) : initialTests;
            });
            const [filter, setFilter] = useState('all');
            const [expandedTest, setExpandedTest] = useState(null);
            const [showExport, setShowExport] = useState(false);
            const [showNewRun, setShowNewRun] = useState(false);
            const [toast, setToast] = useState(null);
            const [runInfo, setRunInfo] = useState(() => {
                const saved = localStorage.getItem('runInfo');
                return saved ? JSON.parse(saved) : { name: 'Test Run', version: 'v1.0.0', tester: '' };
            });

            useEffect(() => {
                localStorage.setItem('testRunData', JSON.stringify(tests));
            }, [tests]);

            useEffect(() => {
                localStorage.setItem('runInfo', JSON.stringify(runInfo));
            }, [runInfo]);

            const stats = {
                total: tests.length,
                passed: tests.filter(t => t.status === 'passed').length,
                failed: tests.filter(t => t.status === 'failed').length,
                blocked: tests.filter(t => t.status === 'blocked').length,
                skipped: tests.filter(t => t.status === 'skipped').length,
                untested: tests.filter(t => t.status === 'untested').length,
            };

            const progress = stats.total > 0 ? Math.round(((stats.passed + stats.failed + stats.blocked + stats.skipped) / stats.total) * 100) : 0;

            const updateStatus = (id, status) => {
                setTests(tests.map(t => t.id === id ? { ...t, status } : t));
                showToast(`${id} marked as ${status}`);
            };

            const updateNotes = (id, notes) => {
                setTests(tests.map(t => t.id === id ? { ...t, notes } : t));
            };

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            const filteredTests = filter === 'all' ? tests : tests.filter(t => t.status === filter);

            const suites = [...new Set(filteredTests.map(t => t.suite))];

            const generateMarkdown = () => {
                const now = new Date().toISOString();
                let md = `# Test Run Report\n\n`;
                md += `**Run Name:** ${runInfo.name}\n`;
                md += `**Version:** ${runInfo.version}\n`;
                md += `**Tester:** ${runInfo.tester}\n`;
                md += `**Generated:** ${now}\n\n`;
                md += `## Summary\n\n`;
                md += `| Status | Count |\n|--------|-------|\n`;
                md += `| ✅ Passed | ${stats.passed} |\n`;
                md += `| ❌ Failed | ${stats.failed} |\n`;
                md += `| ⏸️ Blocked | ${stats.blocked} |\n`;
                md += `| ⏭️ Skipped | ${stats.skipped} |\n`;
                md += `| 🔄 Untested | ${stats.untested} |\n`;
                md += `| **Total** | ${stats.total} |\n\n`;
                md += `**Progress:** ${progress}%\n\n`;
                md += `## Results\n\n`;
                md += `| Test ID | Title | Status | Notes |\n|---------|-------|--------|-------|\n`;
                tests.forEach(t => {
                    const statusEmoji = { passed: '✅', failed: '❌', blocked: '⏸️', skipped: '⏭️', untested: '🔄' }[t.status];
                    md += `| ${t.id} | ${t.title} | ${statusEmoji} ${t.status} | ${t.notes || '-'} |\n`;
                });
                return md;
            };

            const resetRun = () => {
                setTests(initialTests);
                setShowNewRun(false);
                showToast('Test run reset');
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
                showToast('Copied to clipboard!');
            };

            return (
                <div className="app">
                    <header>
                        <div className="logo">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                <path d="M9 11l3 3L22 4"/>
                                <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                            </svg>
                            <h1>GitHub Test Runner</h1>
                        </div>
                        <div className="header-actions">
                            <button className="btn" onClick={() => setShowNewRun(true)}>New Run</button>
                            <button className="btn" onClick={() => setShowExport(true)}>Export Report</button>
                        </div>
                    </header>

                    <div className="stats-grid">
                        <div className="stat-card total">
                            <div className="stat-value">{stats.total}</div>
                            <div className="stat-label">Total</div>
                        </div>
                        <div className="stat-card passed">
                            <div className="stat-value">{stats.passed}</div>
                            <div className="stat-label">Passed</div>
                        </div>
                        <div className="stat-card failed">
                            <div className="stat-value">{stats.failed}</div>
                            <div className="stat-label">Failed</div>
                        </div>
                        <div className="stat-card blocked">
                            <div className="stat-value">{stats.blocked}</div>
                            <div className="stat-label">Blocked</div>
                        </div>
                        <div className="stat-card untested">
                            <div className="stat-value">{stats.untested}</div>
                            <div className="stat-label">Untested</div>
                        </div>
                    </div>

                    <div className="progress-bar">
                        <div className="progress-fill">
                            <div className="progress-segment passed" style={{ width: `${(stats.passed / stats.total) * 100}%` }} />
                            <div className="progress-segment failed" style={{ width: `${(stats.failed / stats.total) * 100}%` }} />
                            <div className="progress-segment blocked" style={{ width: `${(stats.blocked / stats.total) * 100}%` }} />
                        </div>
                    </div>

                    <div className="filters">
                        {['all', 'untested', 'passed', 'failed', 'blocked', 'skipped'].map(f => (
                            <button
                                key={f}
                                className={`filter-btn ${filter === f ? 'active' : ''}`}
                                onClick={() => setFilter(f)}
                            >
                                {f.charAt(0).toUpperCase() + f.slice(1)} {f !== 'all' && `(${stats[f]})`}
                            </button>
                        ))}
                    </div>

                    <div className="test-list">
                        {suites.map(suite => (
                            <div key={suite}>
                                <div className="suite-header">
                                    {suite}
                                    <span className="suite-stats">
                                        {filteredTests.filter(t => t.suite === suite).length} tests
                                    </span>
                                </div>
                                {filteredTests.filter(t => t.suite === suite).map(test => (
                                    <div 
                                        key={test.id} 
                                        className={`test-item ${expandedTest === test.id ? 'expanded' : ''}`}
                                    >
                                        <div className="test-main" onClick={() => setExpandedTest(expandedTest === test.id ? null : test.id)}>
                                            <span className="test-id">{test.id}</span>
                                            <span className="test-title">{test.title}</span>
                                            <span className={`test-priority priority-${test.priority}`}>
                                                {test.priority}
                                            </span>
                                            <div className="status-buttons" onClick={e => e.stopPropagation()}>
                                                <button 
                                                    className={`status-btn pass ${test.status === 'passed' ? 'active' : ''}`}
                                                    onClick={() => updateStatus(test.id, 'passed')}
                                                    title="Pass"
                                                >✓</button>
                                                <button 
                                                    className={`status-btn fail ${test.status === 'failed' ? 'active' : ''}`}
                                                    onClick={() => updateStatus(test.id, 'failed')}
                                                    title="Fail"
                                                >✗</button>
                                                <button 
                                                    className={`status-btn blocked ${test.status === 'blocked' ? 'active' : ''}`}
                                                    onClick={() => updateStatus(test.id, 'blocked')}
                                                    title="Blocked"
                                                >⏸</button>
                                                <button 
                                                    className={`status-btn skip ${test.status === 'skipped' ? 'active' : ''}`}
                                                    onClick={() => updateStatus(test.id, 'skipped')}
                                                    title="Skip"
                                                >⏭</button>
                                            </div>
                                        </div>
                                        {expandedTest === test.id && (
                                            <div className="test-details">
                                                <div className="test-steps">
                                                    <h4>Test Steps</h4>
                                                    <ol>
                                                        {test.steps.map((step, i) => (
                                                            <li key={i}>{step}</li>
                                                        ))}
                                                    </ol>
                                                </div>
                                                <textarea
                                                    className="notes-input"
                                                    placeholder="Add notes, bug references, observations..."
                                                    value={test.notes}
                                                    onChange={(e) => updateNotes(test.id, e.target.value)}
                                                    rows={3}
                                                />
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        ))}
                    </div>

                    {showExport && (
                        <div className="modal-overlay" onClick={() => setShowExport(false)}>
                            <div className="modal" onClick={e => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h2>Export Report</h2>
                                    <button className="btn" onClick={() => setShowExport(false)}>✕</button>
                                </div>
                                <div className="modal-body">
                                    <div className="form-group">
                                        <label>Run Name</label>
                                        <input 
                                            value={runInfo.name} 
                                            onChange={e => setRunInfo({...runInfo, name: e.target.value})}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Version</label>
                                        <input 
                                            value={runInfo.version} 
                                            onChange={e => setRunInfo({...runInfo, version: e.target.value})}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Tester</label>
                                        <input 
                                            value={runInfo.tester} 
                                            onChange={e => setRunInfo({...runInfo, tester: e.target.value})}
                                            placeholder="@username"
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Markdown Preview</label>
                                        <div className="export-preview">{generateMarkdown()}</div>
                                    </div>
                                </div>
                                <div className="modal-footer">
                                    <button className="btn" onClick={() => copyToClipboard(generateMarkdown())}>
                                        Copy Markdown
                                    </button>
                                    <button className="btn btn-primary" onClick={() => {
                                        const blob = new Blob([generateMarkdown()], { type: 'text/markdown' });
                                        const url = URL.createObjectURL(blob);
                                        const a = document.createElement('a');
                                        a.href = url;
                                        a.download = `test-report-${new Date().toISOString().split('T')[0]}.md`;
                                        a.click();
                                    }}>
                                        Download Report
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showNewRun && (
                        <div className="modal-overlay" onClick={() => setShowNewRun(false)}>
                            <div className="modal" onClick={e => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h2>Start New Test Run</h2>
                                    <button className="btn" onClick={() => setShowNewRun(false)}>✕</button>
                                </div>
                                <div className="modal-body">
                                    <p>This will reset all test statuses and notes. Are you sure?</p>
                                </div>
                                <div className="modal-footer">
                                    <button className="btn" onClick={() => setShowNewRun(false)}>Cancel</button>
                                    <button className="btn btn-primary" onClick={resetRun}>Reset & Start New Run</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && (
                        <div className="toast">
                            <span>✓</span> {toast}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
