name: Automated Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test run'
        required: true
        type: choice
        options:
          - smoke
          - regression
          - full
        default: smoke
      browser:
        description: 'Browser to test'
        required: true
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
        default: chromium

env:
  NODE_VERSION: '20'

jobs:
  # Job 1: Run automated tests
  test:
    name: Run Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event.inputs.browser == 'all' && fromJSON('["chromium", "firefox", "webkit"]') || fromJSON(format('["{0}"]', github.event.inputs.browser || 'chromium')) }}
    
    outputs:
      total: ${{ steps.results.outputs.total }}
      passed: ${{ steps.results.outputs.passed }}
      failed: ${{ steps.results.outputs.failed }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        id: playwright
        run: |
          npx playwright test --project=${{ matrix.browser }} --reporter=json,html,junit
        continue-on-error: true

      - name: Parse test results
        id: results
        run: |
          if [ -f test-results/results.json ]; then
            TOTAL=$(jq '.stats.expected' test-results/results.json)
            PASSED=$(jq '.stats.expected - .stats.unexpected' test-results/results.json)
            FAILED=$(jq '.stats.unexpected' test-results/results.json)
          else
            TOTAL=0
            PASSED=0
            FAILED=0
          fi
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.browser }}
          path: test-results/junit.xml

  # Job 2: Create/Update GitHub Issue with results
  report:
    name: Generate Report
    needs: test
    runs-on: ubuntu-latest
    if: always()
    permissions:
      issues: write
      contents: read
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Generate test report
        id: report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Aggregate results from all browsers
            let totalTests = 0;
            let passedTests = 0;
            let failedTests = 0;
            const browserResults = [];
            
            const resultsDir = 'all-results';
            if (fs.existsSync(resultsDir)) {
              const dirs = fs.readdirSync(resultsDir);
              for (const dir of dirs) {
                if (dir.startsWith('test-results-')) {
                  const browser = dir.replace('test-results-', '');
                  const jsonPath = path.join(resultsDir, dir, 'results.json');
                  if (fs.existsSync(jsonPath)) {
                    const data = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
                    const passed = data.stats.expected - data.stats.unexpected;
                    const failed = data.stats.unexpected;
                    browserResults.push({
                      browser,
                      total: data.stats.expected,
                      passed,
                      failed,
                      duration: Math.round(data.stats.duration / 1000)
                    });
                    totalTests += data.stats.expected;
                    passedTests += passed;
                    failedTests += failed;
                  }
                }
              }
            }
            
            const passRate = totalTests > 0 ? Math.round((passedTests / totalTests) * 100) : 0;
            const status = failedTests === 0 ? '✅ PASSED' : '❌ FAILED';
            const statusColor = failedTests === 0 ? '3fb950' : 'f85149';
            
            // Generate markdown report
            let report = `## 🧪 Automated Test Report\n\n`;
            report += `**Status:** ${status}\n`;
            report += `**Commit:** \`${{ github.sha }}\`\n`;
            report += `**Branch:** \`${{ github.ref_name }}\`\n`;
            report += `**Triggered by:** ${{ github.event_name }}\n`;
            report += `**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n`;
            
            report += `### Summary\n\n`;
            report += `| Metric | Value |\n|--------|-------|\n`;
            report += `| Total Tests | ${totalTests} |\n`;
            report += `| ✅ Passed | ${passedTests} |\n`;
            report += `| ❌ Failed | ${failedTests} |\n`;
            report += `| Pass Rate | ${passRate}% |\n\n`;
            
            if (browserResults.length > 0) {
              report += `### Browser Results\n\n`;
              report += `| Browser | Passed | Failed | Duration |\n|---------|--------|--------|----------|\n`;
              for (const br of browserResults) {
                const browserEmoji = br.failed === 0 ? '✅' : '❌';
                report += `| ${browserEmoji} ${br.browser} | ${br.passed} | ${br.failed} | ${br.duration}s |\n`;
              }
              report += '\n';
            }
            
            // Add failed test details if any
            if (failedTests > 0) {
              report += `### ❌ Failed Tests\n\n`;
              for (const dir of fs.readdirSync(resultsDir)) {
                if (dir.startsWith('test-results-')) {
                  const jsonPath = path.join(resultsDir, dir, 'results.json');
                  if (fs.existsSync(jsonPath)) {
                    const data = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
                    for (const suite of data.suites || []) {
                      for (const spec of suite.specs || []) {
                        for (const test of spec.tests || []) {
                          if (test.status === 'unexpected') {
                            report += `- **${spec.title}**\n`;
                            if (test.results?.[0]?.error?.message) {
                              report += `  \`\`\`\n  ${test.results[0].error.message.substring(0, 200)}\n  \`\`\`\n`;
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
            
            report += `\n---\n_Generated automatically by GitHub Actions_`;
            
            core.setOutput('report', report);
            core.setOutput('status', status);
            core.setOutput('pass_rate', passRate);
            core.setOutput('failed', failedTests);

      - name: Find existing test report issue
        id: find-issue
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'test-report,automated',
              state: 'open',
              per_page: 1
            });
            
            if (issues.length > 0) {
              core.setOutput('issue_number', issues[0].number);
            }

      - name: Create or update test report issue
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.report.outputs.report }}`;
            const issueNumber = '${{ steps.find-issue.outputs.issue_number }}';
            const failed = parseInt('${{ steps.report.outputs.failed }}') || 0;
            
            const labels = ['test-report', 'automated'];
            if (failed > 0) labels.push('test-failures');
            
            if (issueNumber) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                body: report
              });
              
              // Update labels
              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                labels: labels
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🧪 Automated Test Results',
                body: report,
                labels: labels
              });
            }

  # Job 3: Update PR with test status
  pr-comment:
    name: Update PR
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let totalTests = 0;
            let passedTests = 0;
            let failedTests = 0;
            
            const resultsDir = 'all-results';
            if (fs.existsSync(resultsDir)) {
              for (const dir of fs.readdirSync(resultsDir)) {
                if (dir.startsWith('test-results-')) {
                  const jsonPath = path.join(resultsDir, dir, 'results.json');
                  if (fs.existsSync(jsonPath)) {
                    const data = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
                    totalTests += data.stats.expected;
                    passedTests += data.stats.expected - data.stats.unexpected;
                    failedTests += data.stats.unexpected;
                  }
                }
              }
            }
            
            const passRate = totalTests > 0 ? Math.round((passedTests / totalTests) * 100) : 0;
            const status = failedTests === 0 ? '✅ All tests passed!' : `❌ ${failedTests} test(s) failed`;
            
            const comment = `## 🧪 Test Results\n\n` +
              `${status}\n\n` +
              `| Passed | Failed | Total | Pass Rate |\n` +
              `|--------|--------|-------|----------|\n` +
              `| ${passedTests} | ${failedTests} | ${totalTests} | ${passRate}% |\n\n` +
              `[View full report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('## 🧪 Test Results')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  # Job 4: Notify on failure
  notify:
    name: Send Notifications
    needs: [test, report]
    runs-on: ubuntu-latest
    if: failure() && github.event_name != 'pull_request'
    
    steps:
      - name: Send Slack notification
        if: vars.SLACK_WEBHOOK_URL
        run: |
          curl -X POST ${{ vars.SLACK_WEBHOOK_URL }} \
            -H 'Content-type: application/json' \
            -d '{
              "text": "❌ Test failures in ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Test failures detected*\n\nRepository: `${{ github.repository }}`\nBranch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }'
