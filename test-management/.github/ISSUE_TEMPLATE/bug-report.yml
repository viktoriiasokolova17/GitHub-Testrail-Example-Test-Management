name: "🐛 Баг з тестування"
description: "Повідомити про баг, знайдений під час тестування"
title: "[BUG] "
labels: ["bug", "from-test"]
body:
  - type: input
    id: test-case
    attributes:
      label: Пов'язаний тест-кейс
      description: "Який тест знайшов цей баг?"
      placeholder: "#123 або TC-AUTH-001"
    validations:
      required: true

  - type: input
    id: test-run
    attributes:
      label: Тестовий прогін
      description: "Під час якого прогону знайдено?"
      placeholder: "#456 або RUN-2024-001"

  - type: dropdown
    id: severity
    attributes:
      label: Серйозність
      options:
        - "🔴 Критична - система не працює"
        - "🟠 Висока - функціонал зламаний"
        - "🟡 Середня - є обхідний шлях"
        - "🟢 Низька - косметична проблема"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Опис бага
      description: "Що пішло не так?"
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Кроки для відтворення
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактичний результат
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Очікуваний результат
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Докази
      description: "Скріншоти, логи, відео тощо"
