<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Results Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e4e4e7;
            min-height: 100vh;
            padding: 2rem;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        h1 { font-size: 1.75rem; font-weight: 600; }
        .badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.875rem;
        }
        .badge.passed { background: #22c55e; color: white; }
        .badge.failed { background: #ef4444; color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1.5rem;
        }
        .card h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #a1a1aa; margin-bottom: 0.5rem; }
        .card .value { font-size: 2.5rem; font-weight: 700; }
        .card .value.green { color: #22c55e; }
        .card .value.red { color: #ef4444; }
        .card .value.yellow { color: #eab308; }
        .card .value.blue { color: #3b82f6; }
        .chart-container { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; }
        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .test-list { background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; }
        .test-list h3 { padding: 1rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .test-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .test-item:last-child { border-bottom: none; }
        .test-status { width: 24px; height: 24px; border-radius: 50%; margin-right: 1rem; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; }
        .test-status.passed { background: #22c55e; }
        .test-status.failed { background: #ef4444; }
        .test-status.skipped { background: #6b7280; }
        .test-name { flex: 1; }
        .test-duration { color: #a1a1aa; font-size: 0.875rem; }
        footer { text-align: center; padding-top: 2rem; color: #6b7280; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧪 Test Results Dashboard</h1>
            <span class="badge passed" id="status-badge">Loading...</span>
        </header>
        
        <div class="grid">
            <div class="card">
                <h3>Total Tests</h3>
                <div class="value blue" id="total">-</div>
            </div>
            <div class="card">
                <h3>Passed</h3>
                <div class="value green" id="passed">-</div>
            </div>
            <div class="card">
                <h3>Failed</h3>
                <div class="value red" id="failed">-</div>
            </div>
            <div class="card">
                <h3>Pass Rate</h3>
                <div class="value" id="pass-rate">-</div>
            </div>
        </div>
        
        <div class="chart-row">
            <div class="chart-container">
                <canvas id="resultsChart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
        
        <div class="test-list">
            <h3>Test Results</h3>
            <div id="test-items"></div>
        </div>
        
        <footer>
            Generated by GitHub Actions • <span id="timestamp"></span>
        </footer>
    </div>
    
    <script>
        // This would be populated by the workflow
        const testData = {"total":10,"passed":8,"failed":2,"skipped":0,"passRate":80,"tests":[{"name":"TC-TODO-001: Test case 1","status":"passed","duration":960},{"name":"TC-TODO-002: Test case 2","status":"passed","duration":1766},{"name":"TC-TODO-003: Test case 3","status":"passed","duration":2046},{"name":"TC-TODO-004: Test case 4","status":"passed","duration":2176},{"name":"TC-TODO-005: Test case 5","status":"passed","duration":2073},{"name":"TC-TODO-006: Test case 6","status":"passed","duration":1127},{"name":"TC-TODO-007: Test case 7","status":"passed","duration":1074},{"name":"TC-TODO-008: Test case 8","status":"passed","duration":1860},{"name":"TC-TODO-009: Test case 9","status":"failed","duration":2100},{"name":"TC-TODO-0010: Test case 10","status":"failed","duration":1547}],"history":[{"date":"5 days ago","passRate":75},{"date":"4 days ago","passRate":80},{"date":"3 days ago","passRate":85},{"date":"2 days ago","passRate":78},{"date":"Yesterday","passRate":90},{"date":"Today","passRate":80}]};
        
        // Update stats
        document.getElementById('total').textContent = testData.total;
        document.getElementById('passed').textContent = testData.passed;
        document.getElementById('failed').textContent = testData.failed;
        document.getElementById('pass-rate').textContent = testData.passRate + '%';
        document.getElementById('timestamp').textContent = new Date().toLocaleString();
        
        const badge = document.getElementById('status-badge');
        if (testData.failed > 0) {
            badge.className = 'badge failed';
            badge.textContent = 'FAILED';
        } else {
            badge.className = 'badge passed';
            badge.textContent = 'PASSED';
        }
        
        // Results pie chart
        new Chart(document.getElementById('resultsChart'), {
            type: 'doughnut',
            data: {
                labels: ['Passed', 'Failed', 'Skipped'],
                datasets: [{
                    data: [testData.passed, testData.failed, testData.skipped || 0],
                    backgroundColor: ['#22c55e', '#ef4444', '#6b7280'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom', labels: { color: '#e4e4e7' } },
                    title: { display: true, text: 'Results Distribution', color: '#e4e4e7' }
                }
            }
        });
        
        // Trend chart (mock data - would be real historical data)
        new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: {
                labels: testData.history?.map(h => h.date) || ['Today'],
                datasets: [{
                    label: 'Pass Rate',
                    data: testData.history?.map(h => h.passRate) || [testData.passRate],
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    title: { display: true, text: 'Pass Rate Trend', color: '#e4e4e7' }
                },
                scales: {
                    y: { min: 0, max: 100, ticks: { color: '#a1a1aa' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                    x: { ticks: { color: '#a1a1aa' }, grid: { color: 'rgba(255,255,255,0.1)' } }
                }
            }
        });
        
        // Test list
        const testItems = document.getElementById('test-items');
        (testData.tests || []).forEach(test => {
            const item = document.createElement('div');
            item.className = 'test-item';
            item.innerHTML = `
                <div class="test-status ${test.status}">${test.status === 'passed' ? '✓' : '✗'}</div>
                <div class="test-name">${test.name}</div>
                <div class="test-duration">${test.duration}ms</div>
            `;
            testItems.appendChild(item);
        });
    </script>
</body>
</html>
